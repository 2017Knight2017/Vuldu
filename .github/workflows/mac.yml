name: Build macOS Binary

on:
  push:
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Check formatting and lints
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Apple Silicon (ARM64 / M-series)
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel Mac (x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload Apple Silicon Binary
        uses: actions/upload-artifact@v4
        with:
          name: vuldu-macos-arm64
          path: target/aarch64-apple-darwin/release/vuldu

      - name: Upload Intel Mac Binary
        uses: actions/upload-artifact@v4
        with:
          name: vuldu-macos-x86_64
          path: target/x86_64-apple-darwin/release/vuldu
